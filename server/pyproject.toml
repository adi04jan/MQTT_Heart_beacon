[project]
name = "hb-server"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "paho-mqtt>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.16"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
