# Heart Beacon brass cage: every dimension the generator uses. mm.
# Regenerate: .venv/Scripts/python heartcage.py          (check + STLs + renders)
#             .venv/Scripts/python heartcage.py --check   (asserts only, ~5 s)
# "MEASURE" marks values that are assumed, not measured.

[heart]
width = 90.0             # overall W over ring centrelines; 88 is the floor for 2 mm clearance to the cell
height_ratio = 0.97      # H / W, from the app twin (Cage.kt)
depth_ratio = 0.5        # D / W, from the app twin
notch = 0.22             # Cage.kt NOTCH (deepened dip between the lobes)
nodes_per_ring = 24      # even; node 0 = notch, node n/2 = tip. triangles = 8 n - 4
mid_z = 12.0             # rings 1 and 3 sit at +-mid_z; rings 0 and 4 at +-D/2
mid_inset = 5.0          # ring 1/3 = ring 2 offset inward by this
small_inset = 14.0       # ring 0/4 = ring 2 offset inward by this
even_weight = 0.3        # pull toward even node spacing while equalising strut lengths
max_classes = 6
class_tol = 0.5

[brass]                  # one gauge for everything: 1.02 mm (19 AWG), the maker's stock
ring_d = 1.02
strut_d = 1.02
rail_d = 1.02
clearance = 0.25         # printed channel = rod + this

[pcb]                    # rev C board; outline and part positions are read from ../pcb/revc.py
thickness = 1.6
top_h = 9.76             # module side: USB-C top above the board (module underside at 5.5)
bottom_h = 3.5           # slide switch body height
smd_h = 2.6              # copper side: tallest SMD part plus trimmed solder joints
switch_h = 10.1          # S1 actuator top: the 10 mm tall tactile switch (MEASURE the actuator)
actuator_d = 6.8         # S1 round actuator (MEASURE)
slider_past_edge = 2.2
usb_plug = [13.0, 7.0]   # plug overmould W x T that must pass the notch window
usb_edge_y = 19.0        # cage y of the board's USB edge (the heart's bbox centre is y = 0)

[battery]                # 3.7 V 800 mAh, ainow.in SKU 5030: "Size: 45x35x5mm", with BMS and a 3-pin lead
t = 5.0
w = 35.0
l = 45.0                 # ASSUMED to include the BMS board (the page does not say)
gap = 0.5
dy = 2.0                 # cell centre above the board centre

[mount]
plate_t = 1.6
post_w = 6.0

[printer]                # Bambu Lab A1 mini
bed = 180.0
height = 180.0

[led]                    # WS2812B 5050 + 1206 caps on two bare rails
inset = 7.0              # LED centre-line = ring 0 offset inward by this
pitch = 4.6              # rail centre to centre (outer = GND, inner = LED+)
recess = 2.5             # rail plane behind ring 0
body = 5.0
body_t = 1.6
cap_gaps = [1, 3, 5, 7]  # 1206 after pixel k (gap 4 is the notch kink: skip)
spoke_gaps = [0, 2, 3, 5, 6, 8]   # GND rail to ring 0 spokes, mid-gap after pixel k; cut to fit

[jig]
relief_r = 4.0           # no plastic inside this radius of a cage joint
base_t = 4.0
