# Heart Beacon v2 broker: its own Mosquitto 1.6.9 instance beside the shared one (/etc/mosquitto is not touched).
# /etc/mosquitto-hb/mosquitto-hb.conf, run by hb-mosquitto.service as user hb. 1.6 has no dynamic security:
# hb-server writes password_file and sends SIGHUP; acl_file is static. The shared broker owns 1883, so the
# router's plain loopback listener is 1884.

persistence true
persistence_location /var/lib/hb-mosquitto/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp false
connection_messages true

allow_anonymous false
password_file /var/lib/hb/passwd
acl_file /etc/mosquitto-hb/acl
# Phones keep a persistent session; beacons use clean start.
persistent_client_expiration 1d
# Envelopes are <= 1024 B (PROTOCOL.md 2.1); the beacon buffer is 2048 B.
message_size_limit 2048

listener 1884 127.0.0.1

listener 8883
cafile /etc/hb/ca.crt
certfile /etc/hb/leaf.crt
keyfile /etc/hb/leaf.key
