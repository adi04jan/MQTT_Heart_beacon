# Same pins as AI-Notes-recorder/android/gradle/libs.versions.toml (Gradle 8.11.1 wrapper).
# M5 adds AGP 8.9.1 and the :app module.
[versions]
kotlin = "2.1.20"
serializationJson = "1.7.3"
junit4 = "4.13.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
